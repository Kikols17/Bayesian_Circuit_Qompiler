experiment:
  name: "ship_localization_qae_4x4"
  output_dir: "outputs/ship_localization_qae_4x4"
  output:
    save_cpd_md: true
    save_circuit_image: true

network:
  builder: "generator"
  save_image: true
  type: "ship_localization"
  params:
    grid_size: 4
    lighthouses:
      - [0, 0]
      - [3, 3]
    num_dist_bins: 2
    num_bear_bins: 2
    dist_noise: [0.85, 0.15, 0.0, 0.0]
    bear_noise: [0.85, 0.15, 0.0, 0.0]

inference:
  compiler: "QAE"
  encoding: "binary"
  encoding_params: {}
  baseline:
    enabled: true
    method: "variable_elimination"
    params: {}
  circuit:
    shots: 4096
    seed: 123
  backend:
    type: "qiskit_aer"
    params:
      mlae_schedule: [0, 1, 2, 4]
      driver: "mlae"
  # Evidence chosen as the most-likely sensor reading at true cell (1, 2);
  # matches the validated prototype scenario in scripts/qae_ship_prototype.py.
  evidence:
    Dist1: 1
    Bear1: 1
    Dist2: 1
    Bear2: 0
  query:
    - "X"
    - "Y"
