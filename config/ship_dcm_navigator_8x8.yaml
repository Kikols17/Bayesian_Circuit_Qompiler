# Ship localization (DCM, binary) — 8x8 grid on Navigator.
# Qubit estimate: ~18 (X+Y=6, 4 obs @ 8 bins => 12). State vector ~4 MB.
experiment:
  name: "ship_localization_dcm_navigator_8x8"
  output_dir: "outputs/ship_localization_dcm_navigator_8x8"
  output:
    save_cpd_md: true
    save_circuit_image: true

network:
  builder: "generator"
  save_image: true
  type: "ship_localization"
  params:
    grid_size: 8
    lighthouses:
      - [1, 3]
      - [6, 7]
    num_dist_bins: 8
    num_bear_bins: 8
    dist_noise: [0.95, 0.03, 0.01, 0.01]
    bear_noise: [0.95, 0.03, 0.01, 0.01]

inference:
  compiler: "DCM"
  encoding: "binary"
  encoding_params: {}
  baseline:
    enabled: true
    method: "variable_elimination"
    params: {}
  circuit:
    shots: 4096
    seed: 123
  backend:
    type: "navigator"
    device: null
    wires: null
    params:
      engine: "pennylane"
      partition: "hpc"
      time_limit: "01:00:00"
      cpus: 8
      mem: "8G"
      nodes: 1
      poll_interval_s: 30
  evidence:
    Dist1: 4
    Bear1: 2
    Dist2: 1
    Bear2: 5
  query:
    - "X"
    - "Y"
