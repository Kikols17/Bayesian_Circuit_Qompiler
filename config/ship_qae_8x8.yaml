experiment:
  name: "ship_localization_qae_8x8"
  output_dir: "outputs/ship_localization_qae_8x8"
  output:
    save_cpd_md: true
    save_circuit_image: true

network:
  builder: "generator"
  save_image: true
  type: "ship_localization"
  params:
    grid_size: 8
    lighthouses:
      - [0, 0]
      - [7, 7]
    num_dist_bins: 2
    num_bear_bins: 2
    dist_noise: [0.85, 0.15, 0.0, 0.0]
    bear_noise: [0.85, 0.15, 0.0, 0.0]

inference:
  compiler: "QAE"
  encoding: "binary"
  encoding_params: {}
  baseline:
    enabled: true
    method: "variable_elimination"
    params: {}
  circuit:
    shots: 4096
    seed: 123
  backend:
    type: "qiskit_aer"
    params:
      mlae_schedule: [0, 1, 2, 4]
      driver: "mlae"
  # Joint register = X(3) + Y(3) + 4*sensors(1) = 10 qubits + 1 flag = 11.
  # 64 cells × |schedule|=4 + 4 (P(e)) = 260 amplitude evaluations.
  evidence:
    Dist1: 0
    Bear1: 0
    Dist2: 1
    Bear2: 1
  query:
    - "X"
    - "Y"
