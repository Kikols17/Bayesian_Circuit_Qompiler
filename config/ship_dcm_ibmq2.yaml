experiment:
  name: "ship_localization_ibmq2"
  output_dir: "outputs/ship_localization_ibmq"
  output:
    save_cpd_md: true
    save_circuit_image: true

network:
  builder: "generator"
  save_image: true
  type: "ship_localization"
  params:
    grid_size: 4
    lighthouses:
      - [1, 1]
      - [3, 2]
    num_dist_bins: 4
    num_bear_bins: 4
    dist_noise: [0.95, 0.03, 0.01, 0.01]
    bear_noise: [0.95, 0.03, 0.01, 0.01]

inference:
  compiler: "DCM"
  encoding: "binary"
  encoding_params: {}
  baseline:
    enabled: true
    method: "variable_elimination"
    params: {}
  circuit:
    shots: 4096
    seed: 123
  backend:
    type: "qiskit_ibm"
    # Set a target IBM backend here, e.g. 'ibmq_qasm_simulator' or 'ibmq_manila'
    device: "ibmq_qasm_simulator"
    #type: "pennylane.simulator"
    #device: "default.qubit"
    wires: 16
  evidence:
    Dist1: 2
    Bear1: 3
    Dist2: 3
    Bear2: 1
  query:
    - "X"
    - "Y"
