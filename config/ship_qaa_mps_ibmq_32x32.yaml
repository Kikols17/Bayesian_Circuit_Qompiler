# MPS encoding (chi=2, row_major), preconditioned QAA, real ibm_fez.
# Derived from the sparse_topk config; same network/evidence so the
# hardware comparison is apples-to-apples. chi=2 is faithful on the
# (peaked) ship posterior per the entanglement diagnostic.
experiment:
  name: ship_localization_qaa_ibmq_32x32_mps
  output_dir: outputs/ship_localization_qaa_ibmq_32x32_mps
  output:
    save_cpd_md: true
    save_circuit_image: true
network:
  builder: generator
  save_image: true
  type: ship_localization
  params:
    grid_size: 32
    lighthouses:
    - - 30
      - 5
    - - 17
      - 25
    num_dist_bins: 32
    num_bear_bins: 32
    dist_noise:
    - 0.95
    - 0.03
    - 0.01
    - 0.01
    bear_noise:
    - 0.95
    - 0.03
    - 0.01
    - 0.01
inference:
  compiler: QAA
  encoding: mps
  encoding_params:
    chi: 2
    order: row_major
  baseline:
    enabled: true
    method: variable_elimination
    params: {}
  circuit:
    shots: 4096
    seed: 123
  backend:
    type: qiskit_ibm
    device: ibm_fez
    wires: 10
  evidence:
    Dist1: 20
    Bear1: 27
    Dist2: 2
    Bear2: 0
  query:
  - X
  - Y
