# Navigator (UC LCA) backend.
#
# One-time remote setup (on navigator.lca.uc.pt):
#   module load python/3.11
#   python -m venv $HOME/venvs/bcc
#   source $HOME/venvs/bcc/bin/activate
#   pip install pennylane pennylane-lightning qiskit qiskit-aer pgmpy numpy scipy matplotlib
#
# Credentials/connection live in .env (NAVIGATOR_USER, NAVIGATOR_SSH_KEY,
# NAVIGATOR_ACCOUNT, NAVIGATOR_REMOTE_DIR, NAVIGATOR_VENV, optional NAVIGATOR_HOST
# and NAVIGATOR_PYTHON_MODULE). SLURM tuning lives below under backend.params.
experiment:
  name: "ship_localization_dcm_navigator"
  output_dir: "outputs/ship_localization_dcm_navigator"
  output:
    save_cpd_md: true
    save_circuit_image: true

network:
  builder: "generator"
  save_image: true
  type: "ship_localization"
  params:
    grid_size: 4
    lighthouses:
      - [1, 1]
      - [3, 2]
    num_dist_bins: 4
    num_bear_bins: 4
    dist_noise: [0.95, 0.03, 0.01, 0.01]
    bear_noise: [0.95, 0.03, 0.01, 0.01]

inference:
  compiler: "DCM"
  encoding: "binary"
  encoding_params: {}
  baseline:
    enabled: true
    method: "variable_elimination"
    params: {}
  circuit:
    shots: 4096
    seed: 123
  backend:
    type: "navigator"
    device: null
    wires: 4
    params:
      engine: "pennylane"        # or "qiskit_aer"
      partition: "hpc"
      time_limit: "01:00:00"
      cpus: 16
      mem: "16G"
      nodes: 1
      poll_interval_s: 30
      # gres: "gpu:v100:1"      # optional, e.g. when using the gpu partition
      # max_wait_s: 14400        # optional cap on local blocking; on timeout, resume later with --resume
      # detach: true             # submit and exit; resume later with --resume
      # tag: "ship_dcm_run1"     # explicit tag (otherwise auto-generated)
  evidence:
    Dist1: 2
    Bear1: 3
    Dist2: 3
    Bear2: 1
  query:
    - "X"
    - "Y"
