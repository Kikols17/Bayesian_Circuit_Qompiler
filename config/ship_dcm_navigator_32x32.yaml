# Ship localization (DCM, binary) — 32x32 grid on Navigator.
# Qubit estimate: ~26 (X+Y=10, 4 obs @ 16 bins => 16). State vector ~1 GB.
# Observation bins kept at 16 to keep total qubits manageable on lightning.qubit.
experiment:
  name: "ship_localization_dcm_navigator_32x32"
  output_dir: "outputs/ship_localization_dcm_navigator_32x32"
  output:
    save_cpd_md: true
    save_circuit_image: true

network:
  builder: "generator"
  save_image: true
  type: "ship_localization"
  params:
    grid_size: 32
    lighthouses:
      - [5, 5]
      - [27, 23]
    num_dist_bins: 16
    num_bear_bins: 16
    dist_noise: [0.95, 0.03, 0.01, 0.01]
    bear_noise: [0.95, 0.03, 0.01, 0.01]

inference:
  compiler: "DCM"
  encoding: "binary"
  baseline:
    enabled: true
    method: "variable_elimination"
    params: {}
  circuit:
    shots: 4096
    seed: 123
  backend:
    type: "navigator"
    device: null
    wires: null
    params:
      engine: "pennylane"
      partition: "hpc"
      time_limit: "06:00:00"
      cpus: 20
      mem: "64G"
      nodes: 1
      poll_interval_s: 60
  evidence:
    Dist1: 10
    Bear1: 10
    Dist2: 2
    Bear2: 8
  query:
    - "X"
    - "Y"
