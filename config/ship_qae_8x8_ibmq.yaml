experiment:
  name: "ship_localization_qae_8x8_ibmq"
  output_dir: "outputs/ship_localization_qae_8x8_ibmq"
  output:
    save_cpd_md: true
    save_circuit_image: true

network:
  builder: "generator"
  save_image: true
  type: "ship_localization"
  params:
    grid_size: 8
    lighthouses:
      - [0, 0]
      - [7, 7]
    num_dist_bins: 2
    num_bear_bins: 2
    dist_noise: [0.85, 0.15, 0.0, 0.0]
    bear_noise: [0.85, 0.15, 0.0, 0.0]

inference:
  compiler: "QAE"
  encoding: "binary"
  encoding_params: {}
  baseline:
    enabled: true
    method: "variable_elimination"
    params: {}
  circuit:
    shots: 1024
    seed: 123
  backend:
    type: "qiskit_ibm"
    device: "ibm_fez"
    params:
      mlae_schedule: [0, 1, 2]
      driver: "mlae"
  # 10 state + 1 flag = 11 qubits. 64 cells × |schedule|=3 + 3 (P(e)) = 195
  # circuits in one batched SamplerV2 job. Past the fez coherence wall at
  # A·Q^2, so this is a plumbing test, not a fidelity benchmark.
  evidence:
    Dist1: 0
    Bear1: 0
    Dist2: 1
    Bear2: 1
  query:
    - "X"
    - "Y"
