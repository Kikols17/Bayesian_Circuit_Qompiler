experiment:
  name: "ship_localization_dcm_ibmq_8x8"
  output_dir: "outputs/ship_localization_dcm_ibmq_8x8"
  output:
    save_cpd_md: true
    save_circuit_image: true

network:
  builder: "generator"
  save_image: true
  type: "ship_localization"
  params:
    grid_size: 8
    lighthouses:
      - [1, 3]
      - [6, 7]
    num_dist_bins: 4
    num_bear_bins: 4
    dist_noise: [0.95, 0.03, 0.01, 0.01]
    bear_noise: [0.95, 0.03, 0.01, 0.01]

inference:
  compiler: "DCM"
  encoding: "binary"
  encoding_params: {}
  baseline:
    enabled: true
    method: "variable_elimination"
    params: {}
  circuit:
    shots: 4096
    seed: 123
  backend:
    type: "qiskit_ibm"
    device: "ibm_fez"
    wires: 4
  evidence:
    Dist1: 2
    Bear1: 2
    Dist2: 0
    Bear2: 0
  query:
    - "X"
    - "Y"
