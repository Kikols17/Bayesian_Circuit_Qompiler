experiment:
  name: "ship_qae_enumerate_iqae_4x4"
  output_dir: "outputs/ship_qae_enumerate_iqae_4x4"
  output:
    save_cpd_md: false
    save_circuit_image: false

network:
  builder: "generator"
  save_image: false
  type: "ship_localization"
  params:
    grid_size: 4
    lighthouses:
      - [0, 0]
      - [3, 3]
    num_dist_bins: 2
    num_bear_bins: 2
    dist_noise: [0.85, 0.15, 0.0, 0.0]
    bear_noise: [0.85, 0.15, 0.0, 0.0]

inference:
  compiler: "QAE"
  encoding: "binary"
  encoding_params: {}
  baseline:
    enabled: true
    method: "variable_elimination"
    params: {}
  circuit:
    shots: 100
    seed: 123
  # Full-posterior reconstruction (enumerate every cell), but with the IQAE
  # driver swapped in via the modular engine instead of the legacy MLAE.
  # Demonstrates pipeline-level driver swappability against the same loader.
  backend:
    type: "qiskit_aer"
    params:
      loader: "faithful"
      driver: "iqae"
      driver_params: {epsilon: 0.02, alpha: 0.05, shots: 100}
      query_mode: "enumerate"
  evidence:
    Dist1: 1
    Bear1: 1
    Dist2: 1
    Bear2: 0
  query:
    - "X"
    - "Y"
