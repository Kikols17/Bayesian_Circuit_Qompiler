experiment:
  name: "ship_qae_single_iqae_16x16"
  output_dir: "outputs/ship_qae_single_iqae_16x16"
  output:
    save_cpd_md: false
    save_circuit_image: false

network:
  builder: "generator"
  save_image: false
  type: "ship_localization"
  params:
    grid_size: 16
    lighthouses:
      - [0, 0]
      - [15, 15]
    num_dist_bins: 2
    num_bear_bins: 2
    dist_noise: [0.85, 0.15, 0.0, 0.0]
    bear_noise: [0.85, 0.15, 0.0, 0.0]

inference:
  compiler: "QAE"
  encoding: "binary"
  encoding_params: {}
  baseline:
    enabled: true
    method: "variable_elimination"
    params: {}
  circuit:
    shots: 200
    seed: 123
  # Upstream single-amplitude query: estimate ONE posterior number
  # P(Y < 8 | evidence) -- "is the ship in the southern half?" -- with IQAE.
  # This is where the advantage matters: a single number from a 12-qubit joint
  # at O(1/eps), without paying for the full 256-cell enumeration. Ship/evidence
  # cloned from ship_qae_16x16.yaml; only the backend changed.
  backend:
    type: "qiskit_aer"
    params:
      loader: "faithful"          # LOADERS: faithful
      marker: "threshold"         # MARKERS: equality | cells | threshold
      marker_params: {var: "Y", op: "lt", value: 8}
      driver: "iqae"              # DRIVERS: mlae | iqae
      driver_params: {epsilon: 0.005, alpha: 0.05, shots: 200}
      query_mode: "single"        # single | enumerate
  evidence:
    Dist1: 0
    Bear1: 0
    Dist2: 1
    Bear2: 1
  query:
    - "X"
    - "Y"
