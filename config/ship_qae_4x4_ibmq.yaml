#pos = 2, 3
experiment:
  name: "ship_localization_qae_4x4_ibmq"
  output_dir: "outputs/ship_localization_qae_4x4_ibmq"
  output:
    save_cpd_md: true
    save_circuit_image: true

network:
  builder: "generator"
  save_image: true
  type: "ship_localization"
  params:
    grid_size: 4
    lighthouses:
      - [1, 1]
      - [3, 2]
    num_dist_bins: 2
    num_bear_bins: 2
    dist_noise: [0.95, 0.03, 0.01, 0.01]
    bear_noise: [0.95, 0.03, 0.01, 0.01]

inference:
  compiler: "QAE"
  encoding: "binary"
  encoding_params: {}
  baseline:
    enabled: true
    method: "variable_elimination"
    params: {}
  circuit:
    shots: 1024
    seed: 123
  backend:
    type: "qiskit_ibm"
    device: "ibm_fez"
    # ----------------------------------------------------------------------
    # HARDWARE "SHORTCUTS" — every knob that lets deep QAE circuits survive a
    # real ibm_fez submission. Full reference: problems/qae_hardware_shortcuts.md
    # These fight two INDEPENDENT IBM limits (see that doc for the distinction):
    #   * error 1336 "Program runtime ran out of memory" — the runtime
    #     CONTAINER's classical RAM, exhausted DURING execution by deep and/or
    #     heavily-twirled circuits. NOT about qubit count.
    #   * error 8055 "Job payload being loaded is too large" — the serialized
    #     job rejected AT LOAD, before it ever runs.
    # Parsed in src/execution/qae_runner.py::_parse_hw_exec_options (with
    # mlae_schedule + max_circuits_per_job parsed alongside in run_qae /
    # _run_qae_sampling). Every knob is optional with a safe default.
    # ----------------------------------------------------------------------
    params:
      driver: "mlae"

      # -- ACCURACY / QUANTUM-ADVANTAGE lever --------------------------------
      # mlae_schedule = the Grover powers m used (each circuit is A·Q^m). This is
      # the ONE knob that decides whether the run carries the formal quantum
      # advantage, and it trades directly against depth (= noise) on NISQ:
      #   [0]       -> m=0 only: just A, NO Grover amplification. Shallowest
      #                (~1.5k CX/circuit here), best chance of a non-flat heatmap,
      #                but it is direct amplitude readout -> no quadratic speed-up.
      #   [0,1,...] -> adds A·Q^1 (~9k CX) and higher: genuine amplitude
      #                estimation WITH amplification (advantage structurally
      #                present), but each Q already exceeds fez's ~1-6k-CX T2
      #                budget, so results get MORE noise-dominated and risk 1336.
      # 9 qubits here (8 state + 1 flag). [0] => 16 cells + 1 P(e) = 17 circuits.
      # This file is the correctness-first run; the [0,1] advantage-first
      # counterpart is the sibling ship_qae_4x4_ibmq_amp.yaml.
      mlae_schedule: [0]

      # -- OOM levers --------------------------------------------------------
      # max_circuits_per_job: split the N circuits across several SamplerV2 jobs
      # (each its own queue + result; amplitudes stitched afterward). Bounds BOTH
      # the per-job payload (8055) AND peak container RAM (1336). The 9-qubit [0]
      # config ran as a single 17-circuit job once (20260610_172905) then failed
      # with 8055 hours later — it sat right on the limit. 6/job (=> 3 jobs of
      # 6/6/5) loads cleanly.
      max_circuits_per_job: 6

      # optimization_level (0-3): transpiler effort. 3 cuts CX count and depth
      # the most => higher fidelity (better RESULTS) AND a smaller payload (less
      # OOM), at the cost of longer LOCAL compile. Best correctness+OOM lever
      # short of shortening the schedule. NB: transpilation runs on YOUR machine
      # before submit, so the runtime container never repeats this work — moving
      # "preprocessing local" does not reduce the OOM; only these knobs do.
      optimization_level: 3

      # dynamical_decoupling: DD pulses on idle qubits. Fidelity only, negligible
      # payload cost. Leave on.
      dynamical_decoupling: true

      # twirling: randomized compiling for error mitigation.
      #   enable_gates / enable_measure: Pauli (2q-gate) and readout (TREX-style)
      #     twirling. Measurement twirling in particular helps the RESULT quality.
      #   num_randomizations: server-side twirl variants generated PER circuit —
      #     the dominant payload/RAM multiplier behind 8055/1336. Omit (= "auto")
      #     to let the runtime pick; pin it low (1-2) to buy OOM headroom at the
      #     cost of mitigation quality. Shots are divided across the variants.
      twirling:
        enable_gates: true
        enable_measure: true
        # num_randomizations: 2          # uncomment to cap the twirl multiplier
        # shots_per_randomization: auto
  evidence:
    Dist1: 1
    Bear1: 1
    Dist2: 0
    Bear2: 1
  query:
    - "X"
    - "Y"
