#pos = 36, 25
experiment:
  name: "ship_localization_qaa_ibmq_64x64"
  output_dir: "outputs/ship_localization_qaa_ibmq_64x64"
  output:
    save_cpd_md: true
    save_circuit_image: true

network:
  builder: "generator"
  save_image: true
  type: "ship_localization"
  params:
    grid_size: 64
    lighthouses:
      - [40, 39]
      - [12, 52]
    num_dist_bins: 64
    num_bear_bins: 64
    dist_noise: [0.95, 0.03, 0.01, 0.01]
    bear_noise: [0.95, 0.03, 0.01, 0.01]

inference:
  compiler: "QAA"
  encoding: "binary"
  encoding_params: {}
  baseline:
    enabled: true
    method: "variable_elimination"
    params: {}
  circuit:
    shots: 4096
    seed: 123
  backend:
    type: "qiskit_ibm"
    device: "ibm_fez"
    wires: 4
  evidence:
    Dist1: 16
    Bear1: 13
    Dist2: 31
    Bear2: 23
  query:
    - "X"
    - "Y"
