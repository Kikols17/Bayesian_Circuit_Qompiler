experiment:
  name: "ship_qae_enumerate_iqae_16x16"
  output_dir: "outputs/ship_qae_enumerate_iqae_16x16"
  output:
    save_cpd_md: false
    save_circuit_image: false

network:
  builder: "generator"
  save_image: false
  type: "ship_localization"
  params:
    grid_size: 16
    lighthouses:
      - [0, 0]
      - [15, 15]
    num_dist_bins: 2
    num_bear_bins: 2
    dist_noise: [0.85, 0.15, 0.0, 0.0]
    bear_noise: [0.85, 0.15, 0.0, 0.0]

inference:
  compiler: "QAE"
  encoding: "binary"
  encoding_params: {}
  baseline:
    enabled: true
    method: "variable_elimination"
    params: {}
  circuit:
    shots: 100
    seed: 123
  # Full-posterior reconstruction with the IQAE driver swapped in. Same faithful
  # loader and ship/evidence as ship_qae_16x16.yaml -- isolates the driver swap.
  # HEAVY: 256 cells, each a full adaptive IQAE run that builds deep Grover
  # powers of a 12-qubit loader. Expect ~30-60 min on a single core. To trade
  # per-cell precision for speed, raise driver_params.epsilon (e.g. 0.05).
  backend:
    type: "qiskit_aer"
    params:
      loader: "faithful"
      driver: "iqae"
      driver_params: {epsilon: 0.02, alpha: 0.05, shots: 100}
      query_mode: "enumerate"
  evidence:
    Dist1: 0
    Bear1: 0
    Dist2: 1
    Bear2: 1
  query:
    - "X"
    - "Y"
