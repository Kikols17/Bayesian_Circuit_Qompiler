experiment:
  name: "ship_localization_qae_16x16_ibmq"
  output_dir: "outputs/ship_localization_qae_16x16_ibmq"
  output:
    save_cpd_md: true
    save_circuit_image: true

network:
  builder: "generator"
  save_image: true
  type: "ship_localization"
  params:
    grid_size: 16
    lighthouses:
      - [0, 0]
      - [15, 15]
    num_dist_bins: 2
    num_bear_bins: 2
    dist_noise: [0.85, 0.15, 0.0, 0.0]
    bear_noise: [0.85, 0.15, 0.0, 0.0]

inference:
  compiler: "QAE"
  encoding: "binary"
  encoding_params: {}
  baseline:
    enabled: true
    method: "variable_elimination"
    params: {}
  circuit:
    shots: 512
    seed: 123
  backend:
    type: "qiskit_ibm"
    device: "ibm_fez"
    params:
      mlae_schedule: [0, 1]
      driver: "mlae"
  # 12 state + 1 flag = 13 qubits. 256 cells × |schedule|=2 + 2 (P(e)) = 514
  # circuits in one batched SamplerV2 job. A·Q^1 alone already exceeds the
  # fez coherence budget; intended as a submission-path stress test. Bumping
  # `shots` or `mlae_schedule` for fidelity will require a deeper-coherence
  # device or error mitigation beyond DD + twirling.
  evidence:
    Dist1: 0
    Bear1: 0
    Dist2: 1
    Bear2: 1
  query:
    - "X"
    - "Y"
