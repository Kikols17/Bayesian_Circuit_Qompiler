experiment:
  name: "ship_localization_qae_16x16_ibmq"
  output_dir: "outputs/ship_localization_qae_16x16_ibmq"
  output:
    save_cpd_md: true
    save_circuit_image: true

network:
  builder: "generator"
  save_image: true
  type: "ship_localization"
  params:
    grid_size: 16
    lighthouses:
      - [0, 0]
      - [15, 15]
    num_dist_bins: 2
    num_bear_bins: 2
    dist_noise: [0.85, 0.15, 0.0, 0.0]
    bear_noise: [0.85, 0.15, 0.0, 0.0]

inference:
  compiler: "QAE"
  encoding: "binary"
  encoding_params: {}
  baseline:
    enabled: true
    method: "variable_elimination"
    params: {}
  circuit:
    shots: 512
    seed: 123
  backend:
    type: "qiskit_ibm"
    device: "ibm_fez"
    params:
      mlae_schedule: [0]
      driver: "mlae"
      max_circuits_per_job: 1
  # 12 state + 1 flag = 13 qubits. ONE transpiled A circuit is ~106k CX at 16x16,
  # which exceeds the IBM Runtime memory cap by itself — full enumerate is
  # infeasible here. max_circuits_per_job=1 transpiles+submits a single circuit at
  # a time so the LOCAL machine never holds all 257 huge circuits (that would OOM
  # the PC); the first chunk OOMs the runtime (error 1336) and the hardened
  # pipeline saves circuit.png + a report documenting the wall. "Document the
  # wall" run, not a usable result.
  evidence:
    Dist1: 0
    Bear1: 0
    Dist2: 1
    Bear2: 1
  query:
    - "X"
    - "Y"
